<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a4 · 商品卡片 + 水平垂直居中</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1a1d23; background: #f6f7f9; }

  /* ---------- 外层：卡片在页面里水平垂直居中 ---------- */
  .page {
    display: flex;              /* 方案一：flex 居中 */
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* ---------- 内层：卡片内部纵向布局，按钮贴底 ---------- */
  .card {
    display: flex;
    flex-direction: column;
    width: 280px;
    height: 360px;          /* 固定高度，才能看出「按钮贴底」 */
    background: #fff;
    border: 1px solid #e4e7ee;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
  }
  .card .thumb { height: 140px; background: #e4e7ee; }   /* 占位图 */
  .card .body { display: flex; flex-direction: column; flex: 1; padding: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; }
  .card .price { color: #e5484d; font-weight: bold; font-size: 18px; margin: 0; }
  .card button {
    margin-top: auto;       /* 关键：把按钮压到底部 */
    border: none;
    background: #2f6fed;
    color: #fff;
    padding: 10px 0;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="thumb"></div>
      <div class="body">
        <h3>商品标题</h3>
        <p class="price">¥199</p>
        <button>加入购物车</button>
      </div>
    </div>
  </div>
</body>
</html>
