<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaDash · 数据看板</title>
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <!-- 整体骨架：Grid 二维布局（移动端单列，lg 以上"侧栏 256px + 内容 1fr"） -->
  <div class="min-h-screen grid grid-cols-1 lg:grid-cols-[16rem_1fr] grid-rows-[auto_1fr_auto]">

    <!-- ===== 顶部导航栏：Flex 首尾贴边 ===== -->
    <header class="lg:col-span-2 sticky top-0 z-10 flex items-center justify-between px-4 sm:px-6 h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
      <div class="flex items-center gap-3">
        <!-- 汉堡按钮：桌面端隐藏（侧边栏常驻），移动端显示 -->
        <button class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="菜单">
          <span class="block w-6 h-0.5 bg-gray-600 dark:bg-gray-300"></span>
          <span class="block w-6 h-0.5 bg-gray-600 dark:bg-gray-300 mt-1"></span>
          <span class="block w-6 h-0.5 bg-gray-600 dark:bg-gray-300 mt-1"></span>
        </button>
        <span class="font-bold text-lg text-gray-900 dark:text-white">NovaDash</span>
      </div>
      <div class="flex items-center gap-4">
        <button class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="通知">
          <span class="text-gray-500 dark:text-gray-300">🔔</span>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <div class="w-9 h-9 rounded-full bg-brand-500 text-white flex items-center justify-center font-medium">张</div>
      </div>
    </header>

    <!-- ===== 侧边栏：移动端隐藏，lg 以上 Flex 纵向 ===== -->
    <aside class="hidden lg:flex flex-col p-4 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800">
      <nav class="flex flex-col gap-1">
        <a href="#" class="nav-link-active"><span>📊</span><span>仪表盘</span></a>
        <a href="#" class="nav-link"><span>🛒</span><span>订单</span></a>
        <a href="#" class="nav-link"><span>👥</span><span>客户</span></a>
        <a href="#" class="nav-link"><span>📈</span><span>报表</span></a>
        <a href="#" class="nav-link"><span>⚙️</span><span>设置</span></a>
      </nav>
      <!-- mt-auto：把用户卡片压到侧边栏底部 -->
      <div class="mt-auto flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-800">
        <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center text-sm">张</div>
        <div class="text-sm">
          <p class="font-medium">张三</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">zhangsan@example.com</p>
        </div>
      </div>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main class="p-4 sm:p-6 lg:p-8 min-w-0">
      <h1 class="text-2xl font-bold">仪表盘</h1>

      <!-- 统计卡片：Grid 等宽 + 响应式改列数（1 → 2 → 4） -->
      <section class="mt-6 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="stat-card dark:bg-gray-900 dark:border-gray-800">
          <p class="text-sm text-gray-500 dark:text-gray-400">总收入</p>
          <p class="mt-1 text-2xl font-bold">¥128,430</p>
          <p class="mt-2 text-sm text-green-600 dark:text-green-400">↑ 12.5%</p>
        </div>
        <div class="stat-card dark:bg-gray-900 dark:border-gray-800">
          <p class="text-sm text-gray-500 dark:text-gray-400">订单数</p>
          <p class="mt-1 text-2xl font-bold">2,341</p>
          <p class="mt-2 text-sm text-green-600 dark:text-green-400">↑ 8.2%</p>
        </div>
        <div class="stat-card dark:bg-gray-900 dark:border-gray-800">
          <p class="text-sm text-gray-500 dark:text-gray-400">活跃用户</p>
          <p class="mt-1 text-2xl font-bold">18,902</p>
          <p class="mt-2 text-sm text-red-600 dark:text-red-400">↓ 3.1%</p>
        </div>
        <div class="stat-card dark:bg-gray-900 dark:border-gray-800">
          <p class="text-sm text-gray-500 dark:text-gray-400">转化率</p>
          <p class="mt-1 text-2xl font-bold">3.42%</p>
          <p class="mt-2 text-sm text-green-600 dark:text-green-400">↑ 0.4%</p>
        </div>
      </section>

      <!-- 内容卡片：图表跨 2 列 + 订单列表 -->
      <section class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold">销售趋势</h2>
            <span class="text-sm text-gray-400 dark:text-gray-500">最近 7 天</span>
          </div>
          <!-- 柱状图占位：高度由数据驱动，用内联样式（真实项目由 JS 算） -->
          <div class="mt-4 flex items-end gap-2 h-48">
            <div class="flex-1 bg-brand-100 rounded-t" style="height: 40%"></div>
            <div class="flex-1 bg-brand-200 rounded-t" style="height: 65%"></div>
            <div class="flex-1 bg-brand-300 rounded-t" style="height: 50%"></div>
            <div class="flex-1 bg-brand-400 rounded-t" style="height: 80%"></div>
            <div class="flex-1 bg-brand-500 rounded-t" style="height: 60%"></div>
            <div class="flex-1 bg-brand-600 rounded-t" style="height: 90%"></div>
            <div class="flex-1 bg-brand-700 rounded-t" style="height: 70%"></div>
          </div>
        </div>
        <div class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm">
          <h2 class="font-semibold">最近订单</h2>
          <ul class="mt-4 flex flex-col divide-y divide-gray-100 dark:divide-gray-800">
            <li class="flex items-center justify-between py-3">
              <span class="text-sm">#1001 · 张三</span>
              <span class="text-sm font-medium text-green-600 dark:text-green-400">已支付</span>
            </li>
            <li class="flex items-center justify-between py-3">
              <span class="text-sm">#1002 · 李四</span>
              <span class="text-sm font-medium text-amber-600 dark:text-amber-400">待发货</span>
            </li>
            <li class="flex items-center justify-between py-3">
              <span class="text-sm">#1003 · 王五</span>
              <span class="text-sm font-medium text-gray-400 dark:text-gray-500">已取消</span>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <!-- ===== 页脚：Flex 首尾贴边 ===== -->
    <footer class="lg:col-span-2 flex items-center justify-between px-4 sm:px-6 py-4 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 text-sm text-gray-500 dark:text-gray-400">
      <span>© 2026 NovaDash · 保留所有权利</span>
      <div class="flex gap-4">
        <a href="#" class="hover:text-gray-900 dark:hover:text-white">隐私政策</a>
        <a href="#" class="hover:text-gray-900 dark:hover:text-white">服务条款</a>
      </div>
    </footer>

  </div>
</body>
</html>
